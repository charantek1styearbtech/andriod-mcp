upstream backend_cluster {
    # Round-robin distribution across instances
    server backend-1:3000;
    server backend-2:3000;
}

server {
    listen 80;
    server_name localhost;

    # Allow large payloads (e.g. high-resolution base64 screenshots)
    client_max_body_size 50M;

    location / {
        proxy_pass http://backend_cluster;

        # HTTP/1.1 and WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE (Server-Sent Events) and WebSockets
        proxy_buffering off;
        proxy_cache off;

        # Extended timeouts for long-lived WebSocket connections & SSE
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
