services:
  redis:
    image: redis:7-alpine
    container_name: android-mcp-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: android-mcp-mongo
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: android-mcp-backend-1
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - INSTANCE_ID=prod-backend-1
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/android_mcp
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: always

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: android-mcp-backend-2
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - INSTANCE_ID=prod-backend-2
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/android_mcp
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: android-mcp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - backend-1
      - backend-2
    restart: always

  certbot:
    image: certbot/certbot
    container_name: android-mcp-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  mongo_data:
  certbot_etc:
  certbot_var:
