services:
  redis:
    image: redis:7-alpine
    container_name: android-mcp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: android-mcp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: android-mcp-backend-1
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - INSTANCE_ID=backend-instance-1
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/android_mcp
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: android-mcp-backend-2
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - INSTANCE_ID=backend-instance-2
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/android_mcp
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: android-mcp-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped

volumes:
  mongo_data:
